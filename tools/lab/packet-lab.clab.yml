name: packet-lab
topology:
  kinds:
    mikrotik_ros:
      image: vrnetlab/mikrotik_ros:7.16
    ceos:
      image: ceos:4.32.0F
    linux:
      image: alpine:3.20
  nodes:
    r1:
      kind: mikrotik_ros
    r2:
      kind: mikrotik_ros
    sw1:
      kind: mikrotik_ros
    e1:
      kind: ceos
    h1:
      kind: linux
      exec:
        - ip addr add 10.20.1.10/24 dev eth1
        - ip route add default via 10.20.1.1
    h2:
      kind: linux
      exec:
        - ip addr add 10.20.2.10/24 dev eth1
        - ip route add default via 10.20.2.1
  links:
    - endpoints: ["r1:eth1", "h1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth2"]
    - endpoints: ["r2:eth1", "h2:eth1"]
    - endpoints: ["r1:eth3", "e1:eth1"]
    - endpoints: ["sw1:eth1", "e1:eth2"]
